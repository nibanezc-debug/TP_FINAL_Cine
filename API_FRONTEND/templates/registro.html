{% extends "base.html" %}
{% block title %}Crear Cuenta | Cine Paradiso{% endblock %}

{% block content %}
<section class="view active" id="view-registro">
  <div class="page-heading">
    <div>
      <a class="back-link" href="{{ url_for('login') }}">← Volver a iniciar sesión</a>
      <span class="eyebrow">NUEVO CLIENTE</span>
      <h1>Crear cuenta</h1>
      <p class="muted">Registrate en Cine Paradiso para reservar tus butacas favoritas.</p>
    </div>
  </div>

  <div class="panel" style="max-width: 460px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('registro') }}" style="display: grid; gap: 1rem;">
      <label class="field">
        <span>NOMBRE COMPLETO</span>
        <input type="text" name="nombre" placeholder="Juan Pérez" required />
      </label>

      <label class="field">
        <span>CORREO ELECTRÓNICO</span>
        <input type="email" name="email" placeholder="juan@email.com" required />
      </label>

      <label class="field">
        <span>CONTRASEÑA</span>
        <input type="password" name="password" placeholder="Mínimo 6 caracteres" required />
      </label>

      <button type="submit" class="button">Registrarme</button>
    </form>

    <p class="muted small" style="margin-top: 1.25rem; text-align: center;">
      ¿Ya tenés cuenta?
      <a href="{{ url_for('login') }}">Iniciá sesión</a>
    </p>
  </div>
</section>
{% endblock %}
