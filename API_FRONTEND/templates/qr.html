
{% extends "base.html" %}

{% block title %}Validar entradas | Cine Paradiso{% endblock %}

{% block content %}

<section class="view active">

    <div class="page-heading">
        <div>
            <span class="eyebrow">BACKOFFICE · ADMINISTRACIÓN</span>
            <h1>Validación de entradas</h1>
            <p class="muted">
                Verificá las entradas antes de permitir el ingreso.
            </p>
        </div>
    </div>

    <div class="panel">

        <h2>Validar código QR</h2>

        <form method="POST">

            <label class="field">
                <span>CÓDIGO QR</span>
                <input
                    type="text"
                    name="codigo_qr"
                    placeholder="Ingresá el código de la entrada"
                    required
                >
            </label>

            <label class="field">
                <span>ID DE LA FUNCIÓN</span>
                <input
                    type="number"
                    name="id_funcion"
                    min="1"
                    placeholder="Ingresá el ID de la función"
                    required
                >
            </label>

            <div class="modal-actions">
                <button type="submit" class="button">
                    Validar entrada
                </button>
            </div>

        </form>

    </div>

</section>

{% endblock %}
