{% extends "base.html" %}
{% block title %}Iniciar Sesión | Cine Paradiso{% endblock %}

{% block content %}
<section class="view active" id="view-login">
  <div class="page-heading">
    <div>
      <a class="back-link" href="{{ url_for('cartelera') }}">← Volver a cartelera</a>
      <span class="eyebrow">ACCESO DE USUARIOS</span>
      <h1>Iniciar sesión</h1>
      <p class="muted">Ingresá con tu cuenta para comprar entradas y gestionar tus reservas.</p>
    </div>
  </div>

  <div class="panel" style="max-width: 460px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('login') }}" style="display: grid; gap: 1rem;">
      <label class="field">
        <span>CORREO ELECTRÓNICO</span>
        <input type="email" name="email" placeholder="juan@email.com" required />
      </label>

      <label class="field">
        <span>CONTRASEÑA</span>
        <input type="password" name="password" placeholder="••••••••" required />
      </label>

      <button type="submit" class="button">Ingresar</button>
    </form>

    <p class="muted small" style="margin-top: 1.25rem; text-align: center;">
      ¿Todavía no tenés cuenta?
      <a href="{{ url_for('registro') }}">Registrate acá</a>
    </p>
  </div>
</section>
{% endblock %}
